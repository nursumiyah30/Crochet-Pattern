</head><body><main class="app"><header><div><h1>🧶 Miyamora Tracker</h1><p class="sub">Your patterns, one round at a time ♡</p></div></header><label class="label" for="projectSelect">SELECT PATTERN</label><div class="custom-select"><button type="button" class="picker select-trigger" id="projectTrigger" aria-expanded="false"><span id="projectLabel">Mini Whale</span><span>⌄</span></button><div id="projectMenu" class="select-menu" hidden></div></div><select id="projectSelect" hidden></select><div class="reference-line" id="referenceLine" hidden>Reference: <a id="referenceLink" target="_blank" rel="noopener noreferrer">Link ↗</a></div><div id="projectArea"><div class="sectionhead"><h2 id="partTitle">Parts</h2><button class="btn ghost small" id="viewAll">☷ Full Pattern</button></div><div class="parts" id="parts"></div><div class="sectionhead"><h2 id="activeTitle">Body · Pattern</h2></div><div class="wheel" id="wheel" aria-live="polite"></div><div class="controls"><button class="btn light" id="previous">← Previous</button><button class="btn" id="next">Next Round →</button></div><div class="foot"><span id="roundStatus">Round 1 of 1</span><button class="btn ghost" id="reset">↺ Reset to R1</button></div></div><p class="hint">Viewer mode · Your round progress auto-saves on this device. Patterns are read-only.</p></main><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="dialog"><h2 id="modalTitle">Add Pattern</h2><div id="modalBody"></div><div class="dialog-actions" id="modalActions"></div></div></div><script>
const KEY='miyamora-viewer-progress-v19';const example=[{id:'whale',name:'Mini Whale',part:'body',parts:[{id:'body',name:'Body',rounds:['6sc in mr [6sc]','6inc [12]','(sc, inc) ×6 [18]','(2sc, inc) ×6 [24]','(3sc, inc) ×6 [30]','30sc [30]']},{id:'belly',name:'Belly',rounds:['6sc in mr [6]','6inc [12]']},{id:'fins',name:'Fins',rounds:['4sc in mr [4]','4inc [8]']},{id:'tail',name:'Tail',rounds:['4sc in mr [4]','4inc [8]','8sc [8]']}],progress:{body:0,belly:0,fins:0,tail:0}}];
let initialViewerProgress={};try{initialViewerProgress=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}let data=example;let active=localStorage.getItem(KEY+'-active')||data[0].id;const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,10),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(Object.fromEntries(data.map(p=>[p.id,{part:p.part,progress:p.progress}]))));localStorage.setItem(KEY+'-active',active)}catch(e){}},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function project(){return data.find(p=>p.id===active)||data[0]}function part(){let p=project();return p.parts.find(x=>x.id===p.part)||p.parts[0]}function icon(s){return '🧶'}
function validUrl(v){try{let u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}function render(){let p=project();active=p.id;if(!p.parts?.length)p.parts=[{id:uid(),name:'Body',rounds:['6sc in mr [6]']}];if(!p.progress)p.progress={};if(!p.parts.some(x=>x.id===p.part))p.part=p.parts[0].id;p.parts.forEach(section=>section.rounds=section.rounds.map(cleanRoundText));let t=part();p.progress[t.id]=Math.max(0,Math.min(t.rounds.length-1,Number(p.progress[t.id])||0));$('projectSelect').innerHTML=data.map(x=>`<option value="${esc(x.id)}" ${x.id===active?'selected':''}>${esc(x.name)}</option>`).join('');$('projectLabel').textContent=p.name;$('projectMenu').innerHTML=data.map(x=>`<button type="button" class="select-option ${x.id===active?'chosen':''}" data-project="${esc(x.id)}">${esc(x.name)} ${x.id===active?'✓':''}</button>`).join('');$('parts').innerHTML=p.parts.map(x=>`<button class="part ${x.id===t.id?'active':''}" data-id="${esc(x.id)}">${esc(x.emoji||'🧶')} ${esc(x.name)}</button>`).join('');$('activeTitle').textContent=t.name;let ref=validUrl(p.reference);$('referenceLine').hidden=!ref;if(ref){$('referenceLink').href=ref;$('referenceLink').textContent=ref.replace(/^https?:\/\//,'').slice(0,48)+' ↗'}drawWheel();save();scheduleFit()}
function fitInstruction(node){let text=node.textContent||'';let len=text.length;let size=len>130?9:len>95?10:len>70?11:len>48?12:len>33?13:15;node.style.fontSize=size+'px';node.style.lineHeight='1.18';}

function cylinderStyle(offset){return `--angle:${offset*22}deg;--depth:${Math.abs(offset)};`}
function wheelPose(offset){
 const h=document.getElementById('wheel').clientHeight/3;
 const y=offset*h;
 const angle=offset*22;
 const scale=Math.max(.88,1-Math.abs(offset)*.045);
 return {transform:`translate3d(0,calc(-50% + ${y}px),0) rotateX(${-angle}deg) scale(${scale})`,opacity:Math.abs(offset)>1?0:offset===0?1:.48};
}
function drawWheel(){
 let p=project(),t=part(),i=p.progress[t.id],wheel=$('wheel');
 wheel.innerHTML='<div class="cylinder">'+[-2,-1,0,1,2].map(off=>{
  let n=i+off;
  return `<div data-offset="${off}" class="cyl-slot ${off===0?'active':''}">${n>=0&&n<t.rounds.length?`<div class="round">ROUND ${n+1}</div><div class="instruction">${esc(cleanRoundText(t.rounds[n]))}</div>`:''}</div>`;
 }).join('')+'</div>';
 wheel.querySelectorAll('.cyl-slot').forEach(el=>{
  const off=Number(el.dataset.offset),pose=wheelPose(off);
  Object.assign(el.style,pose);
  el.style.pointerEvents=Math.abs(off)<=1?'auto':'none';
 });
 wheel.querySelectorAll('.instruction').forEach(fitInstruction);
 $('roundStatus').textContent=`Round ${i+1} of ${t.rounds.length} (${Math.round((i+1)/t.rounds.length*100)}%)`;
 $('previous').disabled=i===0;$('next').disabled=false;$('next').textContent=i===t.rounds.length-1&&p.parts.findIndex(x=>x.id===t.id)<p.parts.length-1?'Next Part →':'Next Round →';
}
let locked=false,suppressClick=false,pending=0;
$('wheel').addEventListener('click',e=>{
 if(suppressClick)return;
 let slot=e.target.closest('.cyl-slot[data-offset]');
 if(slot){let n=Number(slot.dataset.offset);if(Math.abs(n)===1)move(n)}
});
function move(delta){
 if(!delta)return;
 if(locked){pending=delta;return}
 let p=project(),t=part(),i=p.progress[t.id],n=Math.max(0,Math.min(t.rounds.length-1,i+delta));
 if(n===i)return;

 let slots=[...$('wheel').querySelectorAll('.cyl-slot')];
 // Animate the same round cards continuously along a shallow 3D wheel.
 // No remount until the actual motion finishes.
 let animations=slots.map(el=>{
  let off=Number(el.dataset.offset),from=wheelPose(off),to=wheelPose(off-delta);
  return el.animate([from,to],{duration:235,easing:'cubic-bezier(.2,.75,.3,1)',fill:'forwards'});
 });
 Promise.all(animations.map(a=>a.finished.catch(()=>{}))).then(()=>{
  p.progress[t.id]=n;
  animations.forEach(a=>a.cancel());
  drawWheel();save();locked=false;
  if(pending){let d=pending;pending=0;move(d)}
 });
}

function showNextPart(){
 const p=project(),index=p.parts.findIndex(x=>x.id===p.part),next=p.parts[index+1];

 open('Part Completed!','<p class="help">Finished <strong>'+esc(part().name)+'</strong>. Continue to <strong>'+esc(next.name)+'</strong>?</p>','<button class="btn light" id="stayPart">Stay Here</button><button class="btn" id="goNextPart">Next Part →</button>');
 $('stayPart').onclick=close;
 $('goNextPart').onclick=()=>{p.part=next.id;close();render()};
}
$('previous').onclick=()=>move(-1);$('next').onclick=()=>{let p=project(),t=part();if(p.progress[t.id]>=t.rounds.length-1)showNextPart();else move(1)};$('reset').onclick=()=>{let p=project(),t=part();p.progress[t.id]=0;drawWheel();save();scheduleFit()};$('projectSelect').onchange=e=>{active=e.target.value;render()};$('projectTrigger').onclick=()=>{let m=$('projectMenu');m.hidden=!m.hidden;$('projectTrigger').setAttribute('aria-expanded',String(!m.hidden))};$('projectMenu').onclick=e=>{let b=e.target.closest('[data-project]');if(!b)return;active=b.dataset.project;$('projectMenu').hidden=true;$('projectTrigger').setAttribute('aria-expanded','false');render()};document.addEventListener('click',e=>{if(!e.target.closest('.custom-select')){$('projectMenu').hidden=true;$('projectTrigger').setAttribute('aria-expanded','false')}});$('parts').onclick=e=>{let b=e.target.closest('[data-id]');if(b){project().part=b.dataset.id;render()}};

function enhanceDialogSelects(){
 document.querySelectorAll('#modalBody select.dialog-select').forEach(select=>{
  if(select.dataset.enhanced)return;select.dataset.enhanced='1';
  let wrap=document.createElement('div');wrap.className='dialog-picker';
  let trigger=document.createElement('button');trigger.type='button';trigger.className='dialog-trigger';
  let menu=document.createElement('div');menu.className='dialog-menu floating-menu';menu.hidden=true;
  select.parentNode.insertBefore(wrap,select);wrap.append(select,trigger);$('modal').append(menu);
  function update(){
   trigger.textContent=(select.selectedOptions[0]?.textContent||'Select')+'  ⌄';
   menu.innerHTML='';
   Array.from(select.options).forEach(opt=>{
    let b=document.createElement('button');b.type='button';b.className='dialog-option'+(opt.value===select.value?' selected':'');
    b.textContent=opt.textContent;
    b.onclick=()=>{select.value=opt.value;select.dispatchEvent(new Event('change',{bubbles:true}));menu.hidden=true;update()};
    menu.append(b);
   });
  }
  trigger.onclick=()=>{
   document.querySelectorAll('.dialog-menu').forEach(m=>{if(m!==menu)m.hidden=true});
   let show=menu.hidden;menu.hidden=!show;
   if(show){let r=trigger.getBoundingClientRect(),height=Math.min(220,menu.scrollHeight||180);
    menu.style.left=r.left+'px';menu.style.width=r.width+'px';
    menu.style.top=(innerHeight-r.bottom>height+12?r.bottom+5:Math.max(8,r.top-height-5))+'px';
   }
  };
  update();select.addEventListener('change',update);
 });
}
function close(){ $('modal').classList.remove('show');document.querySelectorAll('.floating-menu').forEach(x=>x.remove()) }function open(title,body,actions){document.querySelectorAll('.floating-menu').forEach(x=>x.remove());$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalActions').innerHTML=actions;$('modal').classList.add('show');enhanceDialogSelects()}$('modal').onclick=e=>{if(e.target===$('modal'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});function field(label,id,value='',multi=false){return `<div class="field"><label class="label" for="${id}">${label}</label>${multi?`<textarea id="${id}" placeholder="R1: 6sc in mr [6]\nR2: 6inc [12]">${esc(value)}</textarea>`:`<input id="${id}" value="${esc(value)}" autocomplete="off">`}</div>`}function cleanRoundText(v){
  return String(v||'')
    .replace(/^\s*(?:[•●▪◦‣⁃]\s*)+/u,'')
    .trim()
    .toLowerCase()
    .replace(/\b(mr|blo|flo)\b/gi, token=>token.toUpperCase())
    .replace(/\br\d+(?:\s*[-–—]\s*r?\d+)?\b/gi, token=>token.toUpperCase())
    .replace(/[,:.]+\s*$/g,'')
    .trim();
}
function parseRounds(v){return v.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>cleanRoundText(x.replace(/^\s*(?:r(?:ound)?\s*\d+\s*[:.\-)]\s*)/i,'')))}function patternForm(edit=false){let p=project();open(edit?'Edit Pattern':'Add Pattern',(edit?'<div class="field"><label class="label">Select pattern to edit</label><select class="dialog-select" id="editPatternChoice">'+data.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===p.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div>':'')+field('New Pattern Name','patternName',edit?p.name:'')+field('Reference Link (optional)','patternReference',edit?p.reference||'':'')+`<p class="help">Example: Mini Whale, Bunny, Flower Keychain</p>`,`${edit?'<button class="btn ghost danger" id="deletePattern">Delete</button>':''}<button class="btn light" id="cancel">Cancel</button><button class="btn" id="savePattern">${edit?'Save':'Create Pattern'}</button>`);if(edit)$('editPatternChoice').onchange=e=>{$('patternName').value=data.find(x=>x.id===e.target.value).name;$('patternReference').value=data.find(x=>x.id===e.target.value).reference||''};$('cancel').onclick=close;$('savePattern').onclick=()=>{let name=$('patternName').value.trim();if(!name)return alert('Please enter a pattern name.');if(edit){p=data.find(x=>x.id===$('editPatternChoice').value);p.name=name;p.reference=$('patternReference').value.trim();active=p.id}else{let id=uid();data.push({id,name,reference:$('patternReference').value.trim(),part:'',parts:[{id:'starter',name:'Body',rounds:['6sc in mr [6]']}],progress:{starter:0}});active=id}close();render();if(!edit)partForm(false,true)};if(edit)$('deletePattern').onclick=()=>{p=data.find(x=>x.id===$('editPatternChoice').value);if(!confirm('Delete this pattern and all its parts?'))return;data=data.filter(x=>x.id!==p.id);if(!data.length)data=[{id:uid(),name:'New Pattern',part:'body',parts:[{id:'body',name:'Body',rounds:['6sc in mr [6]']}],progress:{body:0}}];active=data[0].id;close();render()}}
function partForm(edit=false,starter=false){let p=project(),t=part();open(edit?'Edit Part':starter?'Add First Part':'Add Part',(edit?'<div class="field"><label class="label">Select part to edit</label><select class="dialog-select" id="editPartChoice">'+p.parts.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===t.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div>':'')+field('New Part Name','partName',edit?t.name:starter?'Body':'')+`<div class="field"><label class="label">Part emoji</label><div class="emoji-grid" id="emojiGrid">${['🧶','🐳','🐋','🐰','🐻','🐱','🐶','🐸','🐙','🐢','🦋','🐝','🌸','🌷','🌼','🍓','🍒','🍄','⭐','💗','🤍','🩷','🪡','🧵','🎀','👜','🧸','🍀','☁️','✨','🫧','🐟','🦊','🐼','🐧','🐣'].map(e=>`<button type="button" class="emoji-option ${(edit?t.emoji||'🧶':'🧶')===e?'chosen':''}" data-emoji="${e}">${e}</button>`).join('')}</div><input id="partEmoji" type="hidden" value="${esc(edit?t.emoji||'🧶':'🧶')}"><div class="emoji-custom"><label for="emojiCustom">Or enter any emoji</label><input id="emojiCustom" type="text" maxlength="12" placeholder="e.g. 🐬"></div></div>`+field('Rounds — one per line','roundText',edit?t.rounds.map((x,i)=>`R${i+1}: ${x}`).join('\n'):starter?'R1: 6sc in mr [6]\nR2: 6inc [12]':'',true)+`<p class="help">Paste R1, R2, R3... on separate lines. Round numbers are detected automatically.</p>`,`${edit&&p.parts.length>1?'<button class="btn ghost danger" id="deletePart">Delete Part</button>':''}<button class="btn light" id="cancel">Cancel</button><button class="btn" id="savePart">Save Part</button>` );$('emojiGrid').onclick=e=>{let b=e.target.closest('[data-emoji]');if(!b)return;$('partEmoji').value=b.dataset.emoji;$('emojiCustom').value='';$('emojiGrid').querySelectorAll('button').forEach(x=>x.classList.toggle('chosen',x===b))};$('emojiCustom').oninput=e=>{if(e.target.value.trim())$('partEmoji').value=e.target.value.trim()};if(edit)$('editPartChoice').onchange=e=>{t=p.parts.find(x=>x.id===e.target.value);$('partName').value=t.name;$('partEmoji').value=t.emoji||'🧶';$('emojiCustom').value='';$('emojiGrid').querySelectorAll('button').forEach(b=>b.classList.toggle('chosen',b.dataset.emoji===$('partEmoji').value));$('roundText').value=t.rounds.map((x,i)=>`R${i+1}: ${x}`).join('\n')};$('cancel').onclick=close;$('savePart').onclick=()=>{let name=$('partName').value.trim(),rounds=parseRounds($('roundText').value);if(!name||!rounds.length)return alert('Enter a part name and at least one round.');if(edit){t=p.parts.find(x=>x.id===$('editPartChoice').value);p.part=t.id;t.name=name;t.emoji=$('partEmoji').value||'🧶';t.rounds=rounds;p.progress[t.id]=Math.min(p.progress[t.id]||0,rounds.length-1)}else if(starter){t.name=name;t.emoji=$('partEmoji').value||'🧶';t.rounds=rounds;p.progress[t.id]=0}else{let id=uid();p.parts.push({id,name,emoji:$('partEmoji').value||'🧶',rounds});p.part=id;p.progress[id]=0}close();render()};if(edit&&p.parts.length>1)$('deletePart').onclick=()=>{t=p.parts.find(x=>x.id===$('editPartChoice').value);if(!confirm('Delete this part?'))return;p.parts=p.parts.filter(x=>x.id!==t.id);delete p.progress[t.id];p.part=p.parts[0].id;close();render()}}
$('viewAll').onclick=()=>{let p=project();open('Full Pattern · '+p.name,'<div class="full-pattern">'+p.parts.map(t=>`<h3 class="full-part-heading">${esc(t.name)}</h3>`+t.rounds.map((r,i)=>`<button type="button" class="full-row ${t.id===p.part&&i===p.progress[t.id]?'selected':''}" data-part="${esc(t.id)}" data-round="${i}"><strong>R${i+1}</strong><span>${esc(cleanRoundText(r))}</span></button>`).join('')).join('')+'</div>','<button class="btn light" id="cancel">Close</button><button class="btn" id="copyFull">⧉ Copy Pattern</button>');$('cancel').onclick=close;$('copyFull').onclick=async()=>{let text=p.name+'\n\n'+p.parts.map(t=>t.name+'\n'+t.rounds.map((r,i)=>'R'+(i+1)+': '+cleanRoundText(r)).join('\n')).join('\n\n');try{await navigator.clipboard.writeText(text);$('copyFull').textContent='✓ Copied!'}catch(e){let a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();let ok=document.execCommand('copy');a.remove();$('copyFull').textContent=ok?'✓ Copied!':'Copy unavailable'}};$('modalBody').onclick=e=>{let b=e.target.closest('[data-round]');if(!b)return;p.part=b.dataset.part;p.progress[p.part]=Number(b.dataset.round);close();render()}};async function loadPublicPatterns(){try{const r=await fetch('./patterns.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!Array.isArray(j.projects)||!j.projects.length||!j.projects.every(p=>typeof p.name==='string'&&Array.isArray(p.parts)))throw Error('Invalid patterns.json');let saved=initialViewerProgress;data=j.projects.map(p=>({...p,part:saved[p.id]?.part||p.part,progress:saved[p.id]?.progress||{}}));if(!data.some(p=>p.id===active))active=data[0].id;render()}catch(e){console.error('Could not load public patterns',e);document.querySelector('.hint').textContent='Could not load patterns.json. Open the published GitHub Pages URL and check that patterns.json exists.'}}
loadPublicPatterns();
let y=0;$('wheel').addEventListener('touchstart',e=>{y=e.touches[0].clientY},{passive:true});$('wheel').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientY-y;if(Math.abs(d)>45){suppressClick=true;setTimeout(()=>suppressClick=false,350);move(d<0?1:-1)}},{passive:true});render();

let fitScheduled=false;
function scheduleFit(){
 if(fitScheduled)return;fitScheduled=true;
 requestAnimationFrame(()=>{fitScheduled=false;fitToScreen()});
}
function fitToScreen(){
 const app=document.querySelector('.app');if(!app)return;
 app.style.transform='';
 if(window.innerWidth>600)return;
 const available=window.innerHeight-12;
 const natural=app.getBoundingClientRect().height;
 const scale=Math.min(1,available/Math.max(1,natural));
 app.style.transform=`scale(${scale.toFixed(4)})`;
}
window.addEventListener('resize',scheduleFit);
window.visualViewport?.addEventListener('resize',scheduleFit);
window.addEventListener('load',scheduleFit);
scheduleFit();
